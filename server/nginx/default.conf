# SoundTouch station server — nginx config
#
# Serves the JSON descriptors and optionally proxies HTTPS streams to HTTP.

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ── Station JSON files ───────────────────────────────────────────
    location /radio/ {
        root /var/www/html;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        types {
            application/json json;
        }
    }

    # ── HTTPS → HTTP stream proxies ──────────────────────────────────
    # The SoundTouch LOCAL_INTERNET_RADIO source prefers plain HTTP streams.
    # Add a `location` block per HTTPS-only stream you want to use.
    #
    # Pattern:
    #   location /stream/<your-name> {
    #       proxy_pass https://stream.example.com/path;
    #       proxy_ssl_server_name on;
    #       proxy_set_header Host stream.example.com;
    #       proxy_buffering off;
    #       proxy_read_timeout 3600s;
    #       proxy_send_timeout 3600s;
    #   }

    location /stream/dlf {
        proxy_pass https://st01.sslstream.dlf.de/dlf/01/128/mp3/stream.mp3;
        proxy_ssl_server_name on;
        proxy_set_header Host st01.sslstream.dlf.de;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /stream/otvoreni {
        proxy_pass https://stream.otvoreni.hr/otvoreni;
        proxy_ssl_server_name on;
        proxy_set_header Host stream.otvoreni.hr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Health check / landing page ──────────────────────────────────
    location = / {
        return 200 "SoundTouch Station Server\n\nStations: /radio/\nProxied streams: /stream/*\n";
        add_header Content-Type text/plain;
    }
}
