# nginx reverse-proxy config for SoundTouch HTTPS streams
#
# The SoundTouch LOCAL_INTERNET_RADIO source prefers HTTP streams.
# This config converts HTTPS-only streams (like ARD, DLF, Otvoreni) to HTTP
# so the speaker can play them reliably.
#
# Place this in /etc/nginx/sites-available/radio-proxy and symlink to sites-enabled.

server {
    listen 80;
    server_name _;

    # Serve the station JSON files
    location /radio/ {
        root /var/www/html;
        autoindex off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Proxy for Deutschlandfunk (HTTPS → HTTP)
    location /stream/dlf {
        proxy_pass https://st01.sslstream.dlf.de/dlf/01/128/mp3/stream.mp3;
        proxy_ssl_server_name on;
        proxy_set_header Host st01.sslstream.dlf.de;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy for Otvoreni Radio (HTTPS → HTTP)
    location /stream/otvoreni {
        proxy_pass https://stream.otvoreni.hr/otvoreni;
        proxy_ssl_server_name on;
        proxy_set_header Host stream.otvoreni.hr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Template for additional HTTPS stations — copy and adapt
    # location /stream/MY_STATION {
    #     proxy_pass https://example.com/stream;
    #     proxy_ssl_server_name on;
    #     proxy_set_header Host example.com;
    #     proxy_buffering off;
    #     proxy_read_timeout 3600s;
    #     proxy_send_timeout 3600s;
    # }
}
